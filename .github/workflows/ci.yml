name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs a pull request needs. Jobs are skipped with `if:`, never with workflow-level
  # `paths:`: a skipped workflow leaves required checks pending forever, while a skipped job counts
  # as passed (#17). Pushes to `main` run every job regardless. The jobs below fail open: if this job
  # fails, its outputs are empty and they run, so a broken filter can't skip a required check.
  changes:
    name: changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      # On pull requests the filter lists the changed files through the API (no checkout needed).
      - if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflow: &workflow
              - .github/workflows/ci.yml
            backend:
              - *workflow
              - backend/**
              # build.gradle.kts copies the Child color palette from the web app.
              - web/src/shared/palette/**
            web:
              - *workflow
              - web/**
            image:
              - *workflow
              - backend/**
              - web/**
              - Dockerfile
              - .dockerignore
              - deploy/**
              - scripts/image-smoke-test.sh
              - scripts/deploy-stack-test.sh
              - scripts/backup-restore-test.sh

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard self-test
        run: scripts/check-migrations-test.sh
      - name: Merged migrations are append-only (S5)
        env:
          # PRs: against the target branch. Push to main: against the commit before the push.
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: scripts/check-migrations.sh "$BASE"
      - name: Error-code guard self-test
        run: scripts/check-error-codes-test.sh
      - name: Every server error code has a client message (I3)
        run: scripts/check-error-codes.sh
      - name: Shell guard self-test
        run: scripts/check-shell-test.sh
      - name: No pipe into grep -q or head under pipefail
        run: scripts/check-shell.sh
      - name: Doc index guard self-test
        run: scripts/check-doc-index-test.sh
      - name: Doc indexes match their headings
        run: scripts/check-doc-index.sh
      - name: Screenshot guard self-test
        run: scripts/check-screens-test.sh
      - name: Screenshot routes click for real
        run: scripts/check-screens.sh

  backend:
    name: backend
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.backend != 'false') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Spotless check
        run: ./gradlew spotlessCheck
      - name: Compile with Error Prone
        run: ./gradlew compileJava compileTestJava
      - name: Tests (Testcontainers, Modulith)
        run: ./gradlew test
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests

  web:
    name: web
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.web != 'false') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The wrapper's self-test checks it finds JDK 21 and Node 22, so it runs here, with both set
      # up, rather than with the other guards in `migrations`.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Toolchain wrapper self-test
        run: ../scripts/with-toolchain-test.sh
      - name: repeat-test.sh self-test
        run: ../scripts/repeat-test-test.sh
      - name: Prettier
        run: npm run format:check
      - name: ESLint
        run: npm run lint
      - name: TypeScript
        run: npm run typecheck
      - name: Vitest
        run: npm test
      - name: Vitest with the clock a year ahead
        run: npm run test:next-year
      - name: Production build
        run: npm run build

  image:
    name: image
    needs: changes
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.changes.outputs.image != 'false') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/aborgatin/family_app
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: scripts/image-smoke-test.sh "$IMAGE:$GITHUB_SHA"
      - name: Deploy stack test (Compose + Caddy over HTTPS)
        run: scripts/deploy-stack-test.sh "$GITHUB_SHA"
      - name: Backup and restore test (against a local SFTP target)
        run: scripts/backup-restore-test.sh "$GITHUB_SHA"
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
