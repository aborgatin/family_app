# Configuration comes only from environment variables (CODING_STANDARDS A2, spec #5).
# Nothing here is a secret; values without a default must be provided by the environment.
spring:
  application:
    name: family-app
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration
  session:
    jdbc:
      # The tables come from Flyway (V1).
      initialize-schema: never

# Sessions live in PostgreSQL (Spring Session JDBC), so they survive redeploys. The lifetime slides:
# every request with the session renews it on the server and re-sends the cookie.
server:
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:180d}
      cookie:
        http-only: true
        secure: true
        same-site: lax
        max-age: ${SESSION_TIMEOUT:180d}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: false
