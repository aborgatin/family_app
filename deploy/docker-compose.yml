# Production stack (spec #5, Deployment): the app, PostgreSQL 18 and Caddy with automatic HTTPS.
# Configured only through `.env` next to this file (copy `.env.example`). Deploy or update with
#
#   docker compose pull && docker compose up -d
#
# Only Caddy publishes ports. The app trusts X-Forwarded-* only from Caddy's fixed address on the
# internal network (TRUSTED_PROXIES), so login limits see the real client IP.
name: family-app

services:
  app:
    image: ghcr.io/aborgatin/family_app:${APP_IMAGE_TAG:?set APP_IMAGE_TAG in .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
      DATASOURCE_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TRUSTED_PROXIES: 172\.28\.14\.10
      SESSION_TIMEOUT: ${SESSION_TIMEOUT:-180d}
      INVITE_TTL: ${INVITE_TTL:-7d}
      LOGIN_LIMIT_PER_EMAIL: ${LOGIN_LIMIT_PER_EMAIL:-10}
      LOGIN_LIMIT_PER_IP: ${LOGIN_LIMIT_PER_IP:-20}
      LOGIN_LIMIT_WINDOW: ${LOGIN_LIMIT_WINDOW:-15m}
      TZ: ${TZ:-Europe/Berlin}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 2s
    networks:
      internal:

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      start_interval: 1s
    networks:
      internal:

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account; losing them means re-issuing on every start.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      internal:
        # Must match TRUSTED_PROXIES on the app.
        ipv4_address: 172.28.14.10

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.14.0/24

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
